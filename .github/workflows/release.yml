name: Release Consistency Tracker

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Desktop (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Consistency Tracker ${{ github.ref_name }}'
          releaseBody: |
            ## Consistency Tracker ${{ github.ref_name }}

            - Single-file layered architecture with continuous zoom & infinite grid canvas.
            - Pinned habit tracks with custom width resize, internal scroll, and reordering.
            - Chronological sprint notes drawer.
            - Backup export/import with habit merging & Vault protection.
            - Instant theme presets.

            Download the Windows installer below.
          releaseDraft: false
          prerelease: false